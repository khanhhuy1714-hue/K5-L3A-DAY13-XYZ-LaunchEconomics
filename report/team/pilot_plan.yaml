# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: n = 1.251 yêu cầu mỗi nhóm (statsmodels h-method cho 1.250; tổng 2.502 yêu cầu).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 yêu cầu mỗi nhóm -> cần 42 nhân viên mỗi nhóm (tổng 84 > 40 nhân viên hiện có: không đủ người).
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa = c / ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt).
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa = 6 / 0,02 = 300 < 1.251 (quá thấp, chỉ có 6 cụm).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m - 1) × 0,02) >= 859 -> m >= 299 yêu cầu mỗi nhân viên (DE = 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm việc cùng tuần và trên cùng 12 depot với nhóm dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên bằng script bốc thăm có seed công bố trước, phân tầng theo 12 depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ gợi ý trong cùng depot; giảm bằng cấp quyền theo staff_id và ghi log lượt mở trợ lý theo trace_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, toàn bộ chỉ số chính, MDE 6 điểm, 3 luật dừng và ngày 2027-01-05 được khoá trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm (20 cụm nhóm trợ lý, 20 cụm nhóm đối chứng).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Vì LogiX-VN chỉ có 40 nhân viên nên không đạt đủ mẫu cho mức chênh 5 điểm khi chia theo cụm; nhóm chọn chia theo nhân viên (20 + 20) và chấp nhận MDE 6 điểm (m >= 299 yêu cầu/người, DE = 6,96), đồng nghĩa nếu tác động thật chỉ đạt 5 điểm thì power giảm xuống còn khoảng 0,64 (khoảng 36% khả năng bỏ sót tác động thật).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Dữ liệu chạy thử có mo_lai_trong_7_ngay là 4,25% (51/1.200) trên toàn mẫu và 3,97% (39/982) trong phạm vi noi_dia + hang_nang; vì vậy không đặt trần 3% mà chọn luật dừng so với đối chứng (cao hơn đối chứng >= 2 điểm phần trăm) kèm trần tuyệt đối > 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ áp dụng cho noi_dia (2.696 đ = 0,22x, simulated) và hang_nang (8.221 đ = 0,69x, simulated) trên toàn bộ 12 depot với giới hạn tối đa 2 lần chạy; loại quoc_te (22.515 đ = 1,88x, simulated) và doi_tac (10.215 đ = 0,85x, simulated)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên; mỗi bước 1 tuần, đo chỉ số chính đầy đủ từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận (power đạt 0,80 cho +6 điểm; còn 0,64 nếu tác động thật +5 điểm)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có - 20 nhân viên đối chứng xử lý đồng thời trong cùng tuần và cùng 12 depot với 20 nhân viên nhóm trợ lý"
    spillover_risk: "Trung bình - nhân viên cùng depot có thể trao đổi gợi ý; giảm bằng phân tầng ngẫu nhiên theo 12 depot, cấp quyền theo staff_id và ghi log trace_id"
    predeclared: "Có - chỉ số chính, ngưỡng MDE 0,06, 3 luật dừng và ngày quyết định 2027-01-05 được công bố trước khi chạy"
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm phần trăm trở lên hoặc vượt trần 6% (nền chạy thử 4,25% toàn mẫu, 3,97% trong phạm vi), hoặc có từ 1 ca hoàn tiền trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành LogiX-VN bấm cờ tắt trợ lý trong vòng 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công đo từ phút thật vượt 8.000 đ (giới hạn hoà vốn lợi ích pilot) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và khoá giới hạn 2 lần chạy KHÔNG THÌ không được mở rộng nhóm hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) vượt 40% (nền chạy thử 27,12%) TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH phỏng vấn ít nhất 5 nhân viên và rà 20 trace trong vòng 3 ngày KHÔNG THÌ không được tăng tỉ lệ rollout sang bước kế tiếp"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành LogiX-VN bấm cờ tắt tính năng trên hệ thống điều phối trong vòng 30 phút; toàn bộ yêu cầu hoàn phí lập tức chuyển về quy trình nhân viên CSKH tự làm chuẩn"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Cột phut_xem_lai_simulated và phut_lam_lai_simulated trong src/logix_requests.csv"
    - "Chi phí mỗi việc thành công toàn mẫu A2: 4.472 đ (simulated) và cả hệ thống: 5.865 đ/yêu cầu (simulated)"
    - "Chi phí mỗi việc thành công theo loại A3: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ (đều simulated)"
    - "Chi phí phạm vi noi_dia + hang_nang có cố định A4: 4.599 đ ở 45.000 yc/tháng và 5.784 đ ở nửa khối lượng (simulated)"
    - "Độ nhạy B1/B3: làm lại x2 6.787 đ, xem lại x2 6.292 đ, hệ thống giới hạn 2 lần 6.901.220 đ (simulated)"
    - "Chi phí xem lại 100% B4: 11.743 đ với 9 phút làm lại và 12.415 đ với 15,3 phút làm lại (simulated)"
